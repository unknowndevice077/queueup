<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@600;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1080px;height:1080px;overflow:hidden}
  body{background:#17160F;position:relative;font-family:'IBM Plex Sans',sans-serif}
  /* faint ticket perforation ring, stays inside the circle crop */
  .ring{position:absolute;left:90px;top:90px;width:900px;height:900px;border-radius:50%;
        border:3px dashed rgba(246,244,238,.12);box-sizing:border-box}
  .mark{position:absolute;left:50%;top:50%;transform:translate(-50%,-56%)}
  .label{position:absolute;left:0;right:0;top:752px;text-align:center;
         font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:46px;letter-spacing:.14em;color:#F6F4EE}
  .label b{color:#F2BC1F;font-weight:600}
</style></head><body>
  <div class="ring"></div>
  <svg class="mark" width="460" height="400" viewBox="0 0 460 400">
    <g fill="#F2BC1F">
      <rect x="0"  y="20"  width="460" height="72"/>
      <rect x="0"  y="164" width="316" height="72"/>
      <rect x="0"  y="308" width="172" height="72"/>
    </g>
  </svg>
  <div class="label">QUEUE<b>UP</b></div>
</body></html>
