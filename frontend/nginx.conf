server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Redirects to a directory (e.g. /abroad -> /abroad/) keep the host's port instead of the container's.
  absolute_redirect off;

  # Same-origin API and WebSocket in docker compose, so no CORS is needed locally.
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /ws {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }

  location /swagger-ui {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
  }

  location /v3/api-docs {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback: every unknown path renders the React app.
  location / {
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    try_files $uri $uri/ /index.html;
  }
}
