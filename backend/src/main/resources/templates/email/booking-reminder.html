<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <title>Appointment reminder</title>
</head>
<body style="margin:0;padding:24px;background:#f4f4f5;font-family:Arial,Helvetica,sans-serif;color:#18181b;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"
       style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:12px;overflow:hidden;">
  <tr>
    <td style="background:#0f766e;color:#ffffff;padding:20px 24px;font-size:20px;font-weight:bold;">
      See you soon at <span th:text="${businessName}">Kanto Cuts</span>
    </td>
  </tr>
  <tr>
    <td style="padding:24px;">
      <p style="margin:0 0 16px;">Hi <span th:text="${customerName}">Juan</span>, this is a friendly reminder of your appointment.</p>
      <table role="presentation" cellpadding="6" cellspacing="0" style="width:100%;border-collapse:collapse;">
        <tr><td style="color:#71717a;width:110px;">Service</td><td th:text="${serviceName}">Haircut</td></tr>
        <tr><td style="color:#71717a;">With</td><td th:text="${staffName}">Mang Rudy</td></tr>
        <tr><td style="color:#71717a;">When</td><td style="font-weight:bold;" th:text="${when}">Tue, 6 Oct 2026 at 10:00 AM</td></tr>
        <tr th:if="${businessAddress != null}"><td style="color:#71717a;">Where</td><td th:text="${businessAddress}">Address</td></tr>
        <tr th:if="${businessPhone != null}"><td style="color:#71717a;">Phone</td><td th:text="${businessPhone}">0917</td></tr>
      </table>
      <p style="margin:24px 0 0;">Can't make it? Please cancel or reschedule so someone else can take the slot.</p>
      <p style="margin:16px 0 0;">
        <a th:href="${manageUrl}"
           style="display:inline-block;background:#0f766e;color:#ffffff;text-decoration:none;padding:10px 18px;border-radius:8px;">
          Manage my bookings
        </a>
      </p>
    </td>
  </tr>
</table>
</body>
</html>
