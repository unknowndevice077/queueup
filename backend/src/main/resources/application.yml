spring:
  application:
    name: queueup
  profiles:
    default: dev
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/queueup}
    username: ${DB_USER:queueup}
    password: ${DB_PASSWORD:queueup}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  thymeleaf:
    check-template-location: false
  data:
    web:
      pageable:
        max-page-size: 100
        default-page-size: 20
  threads:
    virtual:
      enabled: false

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    mail:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

queueup:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  seed-demo: ${SEED_DEMO:false}
  # Guards GET /api/admin/waitlist.csv; leave empty to disable the export.
  admin-token: ${ADMIN_TOKEN:}
  security:
    jwt-secret: ${JWT_SECRET:}
    access-token-ttl: PT15M
    refresh-token-ttl: P7D
    bcrypt-strength: 12
    auth-rate-limit-per-minute: 5
  booking:
    slot-step-minutes: 15
    pending-payment-ttl: PT15M
  scheduling:
    enabled: true
  mail:
    from: ${MAIL_FROM:QueueUp <no-reply@queueup.local>}
  payments:
    paymongo:
      secret-key: ${PAYMONGO_SECRET_KEY:}
      webhook-secret: ${PAYMONGO_WEBHOOK_SECRET:}
      base-url: https://api.paymongo.com
      signature-tolerance: PT5M
