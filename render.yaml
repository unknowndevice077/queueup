# Render Blueprint: backend web service (Docker) + managed PostgreSQL 16.
# Deploy with: Render dashboard -> New -> Blueprint -> pick this repository. See docs/DEPLOYMENT.md.
databases:
  - name: queueup-db
    plan: free
    databaseName: queueup
    user: queueup
    postgresMajorVersion: "16"

services:
  - type: web
    name: queueup-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Render exposes postgres://user:pass@host:5432/db; the app converts it to a JDBC URL on startup.
      - key: DATABASE_URL
        fromDatabase:
          name: queueup-db
          property: connectionString
      - key: DB_USER
        fromDatabase:
          name: queueup-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: queueup-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false # e.g. https://your-app.vercel.app
      - key: SEED_DEMO
        value: "true"
      - key: ADMIN_TOKEN
        generateValue: true
      - key: JAVA_OPTS
        value: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError -Xss512k"
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_SMTP_AUTH
        value: "true"
      - key: MAIL_STARTTLS
        value: "true"
      - key: MAIL_FROM
        sync: false
      - key: PAYMONGO_SECRET_KEY
        sync: false
      - key: PAYMONGO_WEBHOOK_SECRET
        sync: false
